{% extends "base/base.html" %}
{% block title %}{{ item.title }}{% endblock %}

{% block content %}

<section class="container max-w-screen py-10">

    <h1 class="text-2xl font-bold mb-4">{{ item.title }}</h1>

    {% if item.image %}
        <img src="{{ item.image.url }}"
             class="w-full max-w-xl rounded-lg mb-6">
    {% endif %}

    <div class="text-ink-700 leading-7 text-[15px]">
        {{ item.content|linebreaks }}
    </div>

    <div class="mt-8">
        <a href="{% url 'public:news_list' %}"
           class="inline-block px-4 py-2 bg-primary text-white rounded-lg">
            بازگشت به اخبار
        </a>
    </div>

</section>

{% endblock %}
