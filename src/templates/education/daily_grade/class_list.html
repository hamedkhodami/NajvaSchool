{% extends "base/base_dashboard.html" %}

{% block title %}کلاس‌های من{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow">

    <h1 class="text-lg font-bold mb-4">کلاس‌های من</h1>

    <ul class="space-y-3">
        {% for class in classrooms %}
        <li class="border rounded p-3">

            <div class="font-bold mb-2">
                {{ class.get_grade_display }} — {{ class.name }}
            </div>

            <div class="flex gap-3">
                <a href="{% url 'education:teacher_daily_grade_create' class.id %}"
                   class="px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                    ثبت پرسش جدید
                </a>

                <a href="{% url 'education:teacher_daily_grade_list' class.id %}"
                   class="px-3 py-2 bg-gray-700 text-white rounded hover:bg-gray-800">
                    مشاهده نمرات
                </a>
            </div>

        </li>
        {% endfor %}
    </ul>

</div>
{% endblock %}
