{% extends "base/base.html" %}
{% load static %}

{% block title %}{{ item.title }}{% endblock %}

{% block content %}
<section class="py-16">
    <div class="container max-w-screen">

        <!-- عنوان خبر -->
        <h1 class="text-3xl font-extrabold text-brand mb-6">
            {{ item.title }}
        </h1>

        <!-- تصویر خبر -->
        {% if item.image %}
            <div class="mb-8">
                <img src="{{ item.image.url }}"
                     alt="{{ item.title }}"
                     class="w-full max-w-3xl mx-auto rounded-2xl shadow-card">
            </div>
        {% endif %}

        <!-- متن خبر -->
        <div class="prose prose-sm prose-ink max-w-3xl mx-auto leading-8 text-ink-700 text-[15.5px]">
            {{ item.content|linebreaks }}
        </div>

        <!-- دکمه بازگشت -->
        <div class="mt-10 text-center">
            <a href="{% url 'public:news_list' %}"
               class="inline-flex items-center gap-2 rounded-xl bg-brand px-6 py-3 text-sm font-bold text-white shadow-card transition hover:bg-brand-hover">
                بازگشت به اخبار
                <span aria-hidden="true">←</span>
            </a>
        </div>

    </div>
</section>
{% endblock %}
