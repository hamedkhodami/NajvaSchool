{% load static %}

<header class="bg-white shadow-sm">
    <div class="container max-w-screen flex items-center justify-between py-4">

        <!-- Logo / Title -->
        <div class="text-ink-900 font-bold text-lg">
            مدرسه
        </div>

        <!-- Desktop Nav -->
        <nav class="hidden md:flex items-center gap-8 text-ink-800 text-[15px]">
            <a href="{% url 'public:index' %}" class="hover:text-primary transition">خانه</a>
            <a href="{% url 'account:login' %}" class="hover:text-primary transition">ورود به بخش مدرسه</a>
        </nav>

        <!-- Mobile Menu Button -->
        <button id="mobileMenuBtn"
                class="md:hidden text-ink-800 focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
    </div>

    <!-- Mobile Nav -->
    <nav id="mobileMenu"
         class="md:hidden hidden flex flex-col gap-4 px-6 pb-4 text-ink-800 text-[15px]">
        <a href="{% url 'public:index' %}" class="py-2 border-b border-paper-line">خانه</a>
        <a href="{% url 'account:login' %}" class="py-2 border-b border-paper-line">ورود به بخش مدرسه</a>
    </nav>
</header>
