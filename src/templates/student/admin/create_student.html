{% extends "base/base_dashboard.html" %}
{% load static %}

{% block title %}ایجاد دانش‌آموز جدید{% endblock %}

{% block content %}

<div class="w-full max-w-2xl mx-auto bg-white shadow rounded-lg p-6">

    <h1 class="text-xl font-bold text-center mb-6">ایجاد دانش‌آموز جدید</h1>

    <form method="post" class="space-y-6">
        {% csrf_token %}

        <!-- User Section -->
        <h2 class="text-lg font-semibold mb-2">اطلاعات کاربر</h2>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="text-sm">شماره موبایل</label>
                <input name="phone_number" type="text" class="input">
            </div>

            <div>
                <label class="text-sm">نام</label>
                <input name="first_name" type="text" class="input">
            </div>

            <div>
                <label class="text-sm">نام خانوادگی</label>
                <input name="last_name" type="text" class="input">
            </div>

            <div>
                <label class="text-sm">رمز عبور</label>
                <input name="password1" type="password" class="input">
            </div>

            <div>
                <label class="text-sm">تکرار رمز عبور</label>
                <input name="password2" type="password" class="input">
            </div>
        </div>

        <!-- Student Section -->
        <h2 class="text-lg font-semibold mb-2 pt-4 border-t">اطلاعات دانش‌آموز</h2>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="text-sm">کد ملی</label>
                <input name="national_id" type="text" class="input">
            </div>

            <div>
                <label class="text-sm">نام پدر</label>
                <input name="father_name" type="text" class="input">
            </div>

            <div>
                <label class="text-sm">شماره تماس اولیا</label>
                <input name="parent_phone_number" type="text" class="input">
            </div>

            <div>
                <label class="text-sm">تاریخ تولد</label>
                <input name="birth_date" type="text" class="input">
            </div>

            <div class="col-span-2">
                <label class="text-sm">آدرس</label>
                <textarea name="address" class="input h-20"></textarea>
            </div>

            <div class="col-span-2">
                <label class="text-sm">وضعیت</label>
                <select name="status" class="input">
                    {% for value, label in student_form.fields.status.choices %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <button class="btn">ذخیره</button>
    </form>

</div>

<style>
    .input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 14px;
    }
    .btn {
        width: 100%;
        background: #f0b400;
        color: white;
        padding: 10px;
        border-radius: 6px;
        font-weight: bold;
        font-size: 15px;
    }
</style>

{% endblock %}
