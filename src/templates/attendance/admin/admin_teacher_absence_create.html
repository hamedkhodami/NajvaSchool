{% extends "base/base_dashboard.html" %}
{% load static %}
{% block title %}ثبت غیبت معلم{% endblock %}
{% block dashboard_role %}مدیریت غیبت معلمان{% endblock %}

{% block content %}
<div class="space-y-8">

    <!-- عنوان صفحه -->
    <div class="flex items-center gap-3">
        <span class="h-8 w-1.5 rounded-full bg-danger"></span>
        <h1 class="text-xl font-extrabold text-brand sm:text-2xl">
            ثبت غیبت معلم
        </h1>
    </div>

    <!-- فرم -->
    <form method="post"
          class="rounded-2xl bg-white p-6 shadow-card space-y-6">
        {% csrf_token %}

        <!-- معلم -->
        <div class="space-y-2">
            <label class="text-sm font-bold text-ink-600">معلم:</label>
            <div class="rounded-xl border border-surface-border bg-surface-muted px-4 py-3">
                {{ form.teacher }}
            </div>
        </div>

        <!-- وضعیت -->
        <div class="space-y-2">
            <label class="text-sm font-bold text-ink-600">وضعیت:</label>
            <div class="rounded-xl border border-surface-border bg-surface-muted px-4 py-3">
                {{ form.status }}
            </div>
        </div>

        <!-- توضیحات -->
        <div class="space-y-2">
            <label class="text-sm font-bold text-ink-600">توضیحات:</label>
            <div class="rounded-xl border border-surface-border bg-surface-muted px-4 py-3">
                {{ form.description }}
            </div>
        </div>

        <!-- دکمه -->
        <button
            class="inline-flex items-center gap-2 rounded-xl bg-danger px-6 py-3 text-sm font-bold text-white shadow-card transition hover:bg-danger-hover hover:shadow-lift">
            ثبت غیبت
            <span aria-hidden="true">←</span>
        </button>

    </form>

</div>
{% endblock %}
