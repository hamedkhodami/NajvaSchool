services:

  # ==========================================================
  # DJANGO WEB
  # ==========================================================

  web:
    build:
      context: .
      dockerfile: Dockerfile

    image: website-app

    restart: unless-stopped

    init: true

    stop_grace_period: 40s

    working_dir: /app/src

    env_file:
      - ./src/.env

    environment:
      RUN_MIGRATIONS: "1"
      COLLECT_STATIC: "1"

    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8080
      - --log-level
      - info
      - --workers
      - "4"
      - --threads
      - "2"
      - --timeout
      - "120"
      - --graceful-timeout
      - "30"
      - --max-requests
      - "1000"
      - --max-requests-jitter
      - "100"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"

    expose:
      - "8080"

    volumes:
      - static_volume:/var/www/static
      - /opt/najva-data/media:/var/www/media

    depends_on:
      redis:
        condition: service_healthy

      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/health/', headers={'X-Forwarded-Proto':'https'}), timeout=10)"
        ]

      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 60s


  # ==========================================================
  # POSTGRESQL DATABASE
  # ==========================================================

  db:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-najva}
      POSTGRES_USER: ${POSTGRES_USER:-najva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - /opt/najva-data/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-najva} -d ${POSTGRES_DB:-najva}"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================================
  # REDIS
  # ==========================================================

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - /opt/najva-data/redis:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================================
  # NGINX
  # ==========================================================

  nginx:
    image: nginx:alpine

    restart: unless-stopped

    depends_on:
      web:
        condition: service_healthy

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

      - static_volume:/var/www/static:ro

      - /opt/najva-data/media:/var/www/media:ro

# ============================================================
# VOLUMES
# ============================================================

volumes:
  static_volume: