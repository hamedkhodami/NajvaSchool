
{% load static %}

<footer class="mt-auto border-t border-white/10 bg-brand text-white">
    <div class="container max-w-screen py-6">

        <div class="flex flex-col items-center justify-between gap-5 sm:flex-row">

            <a href="{% url 'public:index' %}"
               class="flex items-center gap-3"
               aria-label="صفحه اصلی مدرسه">

                <span class="flex h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-lg text-brass-300">
                    ✦
                </span>

                <span>
                    <span class="block text-sm font-bold">مدرسه نجوا</span>
                    <span class="mt-1 block text-xs text-slate-300">
                        آموزش، آینده، افتخار
                    </span>
                </span>
            </a>

            <nav class="flex items-center gap-5 text-sm text-slate-300">
                <a href="{% url 'public:index' %}"
                   class="transition hover:text-brass-300">
                    خانه
                </a>

                {% if request.user.is_authenticated %}
                    <a href="{% url 'dashboard:dashboard' %}"
                       class="transition hover:text-brass-300">
                        داشبورد
                    </a>
                {% else %}
                    <a href="{% url 'account:login' %}"
                       class="transition hover:text-brass-300">
                        ورود به سامانه
                    </a>
                {% endif %}
            </nav>

        </div>

        <div class="mt-5 border-t border-white/10 pt-4 text-center text-xs text-slate-400 sm:text-right">
            © {% now "Y" %} مدرسه نجوا. تمامی حقوق محفوظ است.
        </div>

    </div>
</footer>
