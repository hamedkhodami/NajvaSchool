{% extends "base/base_dashboard.html" %}
{% load static %}

{% block title %}داشبورد معلم{% endblock %}

{% block content %}

<div class="container max-w-screen py-10">

        <a href="{% url 'teacher:profile' %}"
           class="block px-4 py-3 bg-primary text-white rounded-lg mb-4">
            پروفایل معلم

    <form method="post" action="{% url 'account:logout' %}">

            خروج
        </button>
    </form>
</div>

{% endblock %}
